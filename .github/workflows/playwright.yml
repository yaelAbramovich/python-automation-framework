name: Playwright tests

# Triggers. Currently manual-only via workflow_dispatch. In addition to manual
# runs, this workflow could also be wired to run on pull_request (e.g. PRs
# targeting main), push (e.g. merges to main or release branches), or schedule
# (cron) for nightly/periodic runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pytest marker to run. Select "all" to run every test.'
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
      # environment:
      #   description: 'Target environment to run against. Each environment has
      #     its own .env file (e.g. .env.dev, .env.staging, .env.prod) that is
      #     loaded before the tests run.'
      #   required: true
      #   type: choice
      #   options:
      #     - dev
      #     - staging
      #     - prod

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Best practice: install only the browsers actually used in CI to
      # save download time and disk. See
      # https://playwright.dev/docs/best-practices#optimize-browser-downloads-on-ci
      - name: Install Playwright browsers (chromium only)
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Run API tests
        run: pytest tests/api ${{ inputs.tag != 'all' && format('-m "{0}"', inputs.tag) || '' }}

      - name: Run UI tests (chromium)
        run: pytest tests/ui ${{ inputs.tag != 'all' && format('-m "{0}"', inputs.tag) || '' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
